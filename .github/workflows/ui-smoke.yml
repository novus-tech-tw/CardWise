name: Widget UI smoke

on:
  pull_request:
    paths:
      - 'CardWise/**'
      - 'CardWiseWidget/**'
      - 'Shared/**'
      - 'CardWiseUITests/**'
      - 'Scripts/run_ui_acceptance.py'
      - 'project.yml'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widget-ui:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$latest" ] && latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Generate project and verify capture settings
        run: |
          brew install xcodegen
          xcodegen generate
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          action = ET.parse('CardWise.xcodeproj/xcshareddata/xcschemes/CardWiseUI.xcscheme').getroot().find('TestAction')
          assert action.get('preferredScreenCaptureFormat') == 'screenshots'
          assert action.get('systemAttachmentLifetime') == 'keepNever'
          PY
      - name: Create disposable simulator
        id: simulator
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(max(rs,key=lambda r: tuple(map(int,r["version"].split("."))))["identifier"])')
          echo "Widget acceptance runtime $runtime"
          device=$(xcrun simctl create 'CardWise Widget Acceptance' com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          echo "id=$device" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device"
          open -a Simulator --args -CurrentDeviceUDID "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Run widget acceptance test
        run: |
          python3 Scripts/run_ui_acceptance.py \
            --device '${{ steps.simulator.outputs.id }}' --result-bundle ui-smoke.xcresult
      - name: Collect focused widget diagnostics
        if: always() && steps.simulator.outputs.id != ''
        run: |
          python3 - <<'PY'
          import subprocess
          device = '${{ steps.simulator.outputs.id }}'
          predicate = 'process == "CardWiseWidget" OR process CONTAINS "Widget" OR process CONTAINS "Gallery" OR (process == "SpringBoard" AND messageType == 16) OR eventMessage CONTAINS "studio.tmj.cardwise.widget"'
          checks = [
              (['xcrun', 'simctl', 'spawn', device, 'log', 'show', '--last', '5m', '--style', 'compact', '--predicate', predicate], 'widget-extension.log'),
              (['xcrun', 'simctl', 'spawn', device, 'launchctl', 'list'], 'simulator-processes.txt'),
          ]
          for command, path in checks:
              with open(path, 'w') as output:
                  try:
                      subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, timeout=30, check=False)
                  except subprocess.TimeoutExpired:
                      output.write('\nDiagnostic collection timed out after 30 seconds.\n')
          PY
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: widget-ui-results
          path: |
            ui-smoke.xcresult
            widget-extension.log
            simulator-processes.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable simulator
        if: always() && steps.simulator.outputs.id != ''
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(['xcrun', 'simctl', 'delete', '${{ steps.simulator.outputs.id }}'], timeout=30, check=True)
          PY
